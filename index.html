<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website | Home</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#0b1020;
            color:#ffffff;
            line-height:1.6;
        }

        a{
            text-decoration:none;
            color:inherit;
        }

        /* ================= HEADER ================= */

        header{
            position:sticky;
            top:0;
            z-index:1000;
            width:100%;
            background:rgba(11,16,32,0.92);
            backdrop-filter:blur(15px);
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .navbar{
            max-width:1200px;
            margin:auto;
            padding:16px 25px;
            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        .logo{
            font-size:24px;
            font-weight:800;
            letter-spacing:.5px;
        }

        .logo span{
            color:#7c5cff;
        }

        .menu{
            display:flex;
            gap:28px;
            align-items:center;
        }

        .menu a{
            font-size:15px;
            color:#d9def0;
            transition:.3s;
        }

        .menu a:hover{
            color:#8d75ff;
        }

        .login-btn{
            padding:10px 18px;
            border-radius:10px;
            background:#7c5cff;
            color:#fff !important;
            font-weight:700;
        }

        .login-btn:hover{
            background:#6847f5;
        }

        /* ================= HERO ================= */

        .hero{
            min-height:650px;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:80px 20px;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(124,92,255,.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(0,200,255,.15),
                    transparent 35%
                );
        }

        .hero-content{
            max-width:850px;
        }

        .badge{
            display:inline-block;
            padding:8px 15px;
            margin-bottom:22px;
            border:1px solid rgba(255,255,255,.12);
            border-radius:30px;
            background:rgba(255,255,255,.05);
            color:#bfc6df;
            font-size:14px;
        }

        .hero h1{
            font-size:clamp(42px,7vw,72px);
            font-weight:800;
            line-height:1.1;
            margin-bottom:20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">My<span>Website</span></div>
            <div class="menu">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#" class="login-btn">Login</a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <span class="badge">Welcome to our platform</span>
            <h1>Build your amazing web experience</h1>
        </div>
    </section>

</body>
</html>
