<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Login | Bangladesh Time</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body{
    background:
        radial-gradient(
            circle at 18% 25%,
            rgba(255,255,255,.9),
            transparent 25%
        ),
        radial-gradient(
            circle at 75% 15%,
            rgba(255,255,255,.65),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #9fc5ee 0%,
            #dceafa 48%,
            #f7fbff 100%
        );

    color:#17316b;
}


/* =====================================================
   MAIN PAGE
===================================================== */

.page{
    width:100vw;
    height:100svh;

    display:grid;

    grid-template-columns:42% 58%;

    align-items:center;

    overflow:hidden;

    position:relative;

    padding:
        clamp(10px,2vw,30px);
}


.page::before{
    content:"";

    position:absolute;

    width:45vw;
    height:45vw;

    max-width:600px;
    max-height:600px;

    border-radius:50%;

    background:
        rgba(255,255,255,.20);

    filter:blur(60px);

    left:-10vw;
    top:-15vw;

    pointer-events:none;
}


.page::after{
    content:"";

    position:absolute;

    width:55vw;
    height:12vw;

    bottom:-2vw;
    left:-5vw;

    border-radius:50%;

    border-top:
        3px solid
        rgba(255,255,255,.55);

    box-shadow:
        0 -12px 30px
        rgba(255,255,255,.35),

        0 -25px 55px
        rgba(255,255,255,.2);

    transform:rotate(8deg);

    pointer-events:none;
}


/* =====================================================
   LEFT CLOCK AREA
===================================================== */

.clock-area{
    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    position:relative;

    z-index:2;

    min-width:0;
}


.clock-frame{
    width:min(28vw,390px);
    height:min(28vw,390px);

    min-width:170px;
    min-height:170px;

    max-width:390px;
    max-height:390px;

    display:flex;

    align-items:center;
    justify-content:center;

    filter:
        drop-shadow(
            0 18px 22px
            rgba(25,48,91,.28)
        )
        drop-shadow(
            0 0 18px
            rgba(255,255,255,.35)
        );
}


/* =====================================================
   ANALOG CLOCK
===================================================== */

.clock{
    width:100%;
    height:100%;

    border-radius:50%;

    position:relative;

    background:
        radial-gradient(
            circle at 40% 35%,
            #ffffff 0%,
            #f1f5fc 45%,
            #d9e1ee 100%
        );

    border:
        clamp(5px,.65vw,9px)
        solid #182233;

    box-shadow:

        inset
        0 0 0
        clamp(2px,.3vw,4px)
        #5d6572,

        inset
        0 0 25px
        rgba(25,44,77,.28),

        0 5px 0
        #0b111c,

        0 12px 20px
        rgba(18,35,65,.25);
}


.clock::before{
    content:"";

    position:absolute;

    inset:4%;

    border-radius:50%;

    border:
        1px solid
        rgba(40,57,82,.3);

    box-shadow:
        inset
        0 0 12px
        rgba(50,70,100,.12);
}


/* =====================================================
   CLOCK NUMBERS
===================================================== */

.clock-number{
    position:absolute;

    left:50%;
    top:50%;

    width:100%;
    height:100%;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    font-size:
        clamp(17px,2.1vw,29px);

    color:#101722;

    font-weight:400;
}

.clock-number span{
    position:absolute;

    transform:
        translate(-50%,-50%);
}


.n12{left:50%;top:10%;}
.n1{left:68%;top:15%;}
.n2{left:82%;top:27%;}
.n3{left:90%;top:50%;}
.n4{left:82%;top:73%;}
.n5{left:68%;top:85%;}
.n6{left:50%;top:91%;}
.n7{left:32%;top:85%;}
.n8{left:18%;top:73%;}
.n9{left:10%;top:50%;}
.n10{left:18%;top:27%;}
.n11{left:32%;top:15%;}


/* =====================================================
   CLOCK HANDS
===================================================== */

.hand{
    position:absolute;

    left:50%;
    top:50%;

    transform-origin:
        50% 100%;

    transform:
        translate(-50%,-100%)
        rotate(0deg);

    border-radius:10px;

    z-index:5;
}


.hour-hand{
    width:5px;
    height:27%;
    background:#151b24;
}

.minute-hand{
    width:4px;
    height:37%;
    background:#151b24;
}

.second-hand{
    width:1.5px;
    height:42%;
    background:#2b5fc7;
}


.clock-center{
    position:absolute;

    left:50%;
    top:50%;

    width:13px;
    height:13px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#171e29;

    border:
        2px solid
        #0d121a;

    z-index:10;
}


/* =====================================================
   DIGITAL BANGLADESH TIME
===================================================== */

.time-box{
    width:min(28vw,390px);

    margin-top:
        clamp(15px,2vw,28px);

    padding:
        clamp(10px,1.3vw,20px)
        clamp(8px,1vw,15px);

    text-align:center;

    border-radius:24px;

    background:
        rgba(255,255,255,.20);

    border:
        1px solid
        rgba(255,255,255,.6);

    box-shadow:

        0 10px 30px
        rgba(38,76,130,.12),

        inset
        0 1px 0
        rgba(255,255,255,.6);

    backdrop-filter:
        blur(12px);
}

.date{
    font-size:
        clamp(10px,1.1vw,16px);

    margin-bottom:5px;

    color:#1c3b78;
}

.digital-time{
    font-size:
        clamp(23px,3vw,48px);

    font-weight:600;

    color:#173b82;

    white-space:nowrap;

    letter-spacing:1px;
}

.zone{
    margin-top:4px;

    font-size:
        clamp(9px,1vw,15px);

    color:#294577;
}


/* =====================================================
   RIGHT LOGIN AREA
===================================================== */

.login-area{
    width:100%;
    height:100%;

    min-width:0;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    z-index:3;

    padding:
        clamp(5px,1vw,20px);
}


.login-card{
    width:min(43vw,650px);

    max-height:94svh;

    padding:
        clamp(18px,2.2vw,36px)
        clamp(20px,3vw,48px);

    border-radius:
        clamp(20px,2.5vw,38px);

    background:
        rgba(247,251,255,.55);

    border:
        1px solid
        rgba(255,255,255,.9);

    box-shadow:

        0 20px 55px
        rgba(47,79,130,.16),

        inset
        0 1px 0
        rgba(255,255,255,.85);

    backdrop-filter:
        blur(22px);

    display:flex;

    flex-direction:column;

    align-items:center;

    overflow:hidden;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome{
    text-align:center;

    margin-bottom:
        clamp(10px,1.5vw,20px);
}

.welcome h1{
    font-size:
        clamp(23px,2.6vw,38px);

    color:#183674;

    letter-spacing:1px;

    margin-bottom:5px;
}

.welcome p{
    font-size:
        clamp(11px,1.25vw,17px);

    color:#344f7c;
}


/* =====================================================
   PROFILE
===================================================== */

.profile{
    width:
        clamp(75px,8vw,112px);

    height:
        clamp(75px,8vw,112px);

    border-radius:50%;

    padding:
        clamp(4px,.5vw,7px);

    margin-bottom:
        clamp(9px,1vw,15px);

    background:
        linear-gradient(
            135deg,
            #dffaff,
            #2878ec,
            #8fe9ff,
            #2867d8,
            #dffaff
        );

    box-shadow:

        0 0 15px
        rgba(46,141,255,.35),

        0 0 28px
        rgba(46,141,255,.18);

    animation:
        profileRotate
        5s linear infinite;
}

@keyframes profileRotate{

    to{
        transform:
            rotate(360deg);
    }
}


.avatar{
    width:100%;
    height:100%;

    border-radius:50%;

    background:

        radial-gradient(
            circle at 50% 35%,
            #f8fbff 0 14%,
            transparent 15%
        ),

        radial-gradient(
            ellipse at 50% 72%,
            #f8fbff 0 25%,
            transparent 26%
        ),

        linear-gradient(
            145deg,
            #1d4c9d,
            #287be8
        );

    border:
        clamp(3px,.4vw,5px)
        solid #edf8ff;

    box-shadow:
        inset
        0 0 15px
        rgba(255,255,255,.22);
}


/* =====================================================
   LOGIN TITLE
===================================================== */

.login-title{
    font-size:
        clamp(21px,2.2vw,32px);

    font-weight:700;

    color:#193c7c;

    text-align:center;

    margin-bottom:
        clamp(7px,1vw,13px);
}

.login-line{
    width:
        clamp(55px,5vw,75px);

    height:4px;

    border-radius:10px;

    background:#2877e8;

    margin:
        0 auto
        clamp(17px,2vw,27px);
}


/* =====================================================
   FORM
===================================================== */

.form{
    width:100%;
}

.input-wrap{
    width:100%;

    position:relative;

    margin-bottom:
        clamp(10px,1.25vw,17px);
}

.input{
    width:100%;

    height:
        clamp(43px,4.5vw,62px);

    border:0;
    outline:0;

    border-radius:13px;

    background:#263a61;

    color:white;

    padding:
        0
        clamp(34px,3.5vw,55px)
        0
        clamp(43px,4vw,60px);

    font-size:
        clamp(12px,1.25vw,17px);

    transition:
        box-shadow .2s ease;
}


.input-wrap.active .input{

    box-shadow:

        0 0 0 2px
        #27d17c,

        0 0 15px
        rgba(39,209,124,.45);
}

.input::placeholder{
    color:#c7d0e0;
}


.input-icon{
    position:absolute;

    left:
        clamp(14px,1.5vw,22px);

    top:50%;

    transform:
        translateY(-50%);

    color:white;

    font-size:
        clamp(15px,1.6vw,22px);

    pointer-events:none;
}


/* =====================================================
   PASSWORD BUTTON
===================================================== */

.password-toggle{

    position:absolute;

    right:
        clamp(14px,1.5vw,20px);

    top:50%;

    transform:
        translateY(-50%);

    width:9px;
    height:9px;

    min-width:9px;
    min-height:9px;

    padding:0;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.95);

    background:transparent;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    transition:
        background .15s ease,
        box-shadow .15s ease;
}


.password-toggle.show{

    background:#ffffff;

    box-shadow:
        0 0 4px
        rgba(255,255,255,.45);
}


/* =====================================================
   OPTIONS
===================================================== */

.options{
    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin:
        clamp(5px,.8vw,10px)
        0
        clamp(14px,1.7vw,22px);

    font-size:
        clamp(10px,1.1vw,15px);
}

.remember{
    display:flex;

    align-items:center;

    gap:7px;

    color:#2a4775;

    white-space:nowrap;
}

.remember input{
    width:
        clamp(14px,1.4vw,19px);

    height:
        clamp(14px,1.4vw,19px);

    accent-color:#2678ea;
}

.forgot{
    border:0;

    background:none;

    color:#3679dc;

    font-size:inherit;

    cursor:pointer;

    white-space:nowrap;
}


/* =====================================================
   SIGN IN
===================================================== */

.sign-in{
    width:100%;

    height:
        clamp(44px,4.7vw,63px);

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #287bea,
            #1761e7
        );

    color:white;

    font-size:
        clamp(14px,1.45vw,19px);

    font-weight:600;

    letter-spacing:.5px;

    cursor:pointer;

    box-shadow:
        0 8px 17px
        rgba(39,105,225,.25);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.sign-in:hover{

    transform:
        translateY(-1px);

    box-shadow:
        0 11px 22px
        rgba(39,105,225,.32);
}


/* =====================================================
   OR DIVIDER
===================================================== */

.divider{
    width:100%;

    display:flex;

    align-items:center;

    gap:14px;

    margin:
        clamp(13px,1.5vw,20px)
        0;
}

.divider::before,
.divider::after{

    content:"";

    height:1px;

    background:
        rgba(70,101,153,.22);

    flex:1;
}

.divider span{

    color:#5773a4;

    font-size:
        clamp(11px,1.15vw,16px);
}


/* =====================================================
   CREATE ACCOUNT
===================================================== */

.register{
    width:100%;

    height:
        clamp(42px,4.5vw,60px);

    border:
        2px solid
        #5a80c4;

    border-radius:13px;

    background:
        rgba(255,255,255,.10);

    color:#2859a8;

    font-size:
        clamp(12px,1.3vw,17px);

    font-weight:600;

    letter-spacing:.5px;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    text-decoration:none;
}

.register-icon{
    font-size:
        clamp(17px,1.7vw,24px);
}


/* =====================================================
   SMALL SCREENS
===================================================== */

@media(max-width:700px){

    .page{

        grid-template-columns:
            40% 60%;

        padding:7px;
    }


    .clock-frame{

        min-width:0;
        min-height:0;

        width:
            clamp(125px,34vw,230px);

        height:
            clamp(125px,34vw,230px);
    }


    .time-box{

        width:
            clamp(125px,34vw,230px);

        padding:8px 4px;

        border-radius:15px;
    }


    .login-card{

        width:100%;

        padding:
            14px 12px;

        border-radius:20px;
    }


    .welcome h1{

        font-size:
            clamp(17px,4vw,25px);
    }


    .welcome p{

        font-size:
            clamp(8px,2.2vw,13px);
    }


    .profile{

        width:
            clamp(55px,14vw,85px);

        height:
            clamp(55px,14vw,85px);
    }


    .login-title{

        font-size:
            clamp(17px,4vw,25px);
    }


    .login-line{

        margin-bottom:12px;
    }


    .input{

        height:
            clamp(38px,8vw,50px);

        padding-left:38px;
        padding-right:30px;

        border-radius:10px;
    }


    .input-icon{

        left:11px;
    }


    .password-toggle{

        right:8px;

        width:7px;
        height:7px;

        min-width:7px;
        min-height:7px;

        border-width:1px;
    }


    .options{

        font-size:
            clamp(8px,2.1vw,12px);
    }


    .sign-in{

        height:
            clamp(38px,8vw,50px);

        font-size:
            clamp(11px,2.5vw,15px);
    }


    .register{

        height:
            clamp(37px,8vw,48px);

        font-size:
            clamp(9px,2.3vw,14px);
    }


    .hour-hand{
        width:3.5px;
    }

    .minute-hand{
        width:3px;
    }

    .second-hand{
        width:1px;
    }

    .clock-center{
        width:10px;
        height:10px;
    }
}


@media(max-width:380px){

    .page{

        grid-template-columns:
            38% 62%;

        padding:4px;
    }


    .login-area{

        padding:3px;
    }


    .login-card{

        padding:
            10px 8px;
    }


    .clock-frame{

        width:34vw;
        height:34vw;
    }


    .time-box{

        width:34vw;
    }


    .digital-time{

        font-size:
            clamp(15px,4.5vw,22px);
    }


    .date{
        font-size:7px;
    }


    .zone{
        font-size:7px;
    }


    .password-toggle{

        width:6px;
        height:6px;

        min-width:6px;
        min-height:6px;
    }
}

</style>
</head>


<body>

<div class="page">

    <section class="clock-area">

        <div class="clock-frame">

            <div class="clock">

                <div class="clock-number">

                    <span class="n12">12</span>
                    <span class="n1">1</span>
                    <span class="n2">2</span>
                    <span class="n3">3</span>
                    <span class="n4">4</span>
                    <span class="n5">5</span>
                    <span class="n6">6</span>
                    <span class="n7">7</span>
                    <span class="n8">8</span>
                    <span class="n9">9</span>
                    <span class="n10">10</span>
                    <span class="n11">11</span>

                </div>


                <div
                    class="hand hour-hand"
                    id="hourHand">
                </div>


                <div
                    class="hand minute-hand"
                    id="minuteHand">
                </div>


                <div
                    class="hand second-hand"
                    id="secondHand">
                </div>


                <div class="clock-center"></div>

            </div>

        </div>


        <div class="time-box">

            <div
                class="date"
                id="date">

                Loading...

            </div>


            <div
                class="digital-time"
                id="digitalTime">

                00:00:00

            </div>


            <div class="zone">

                Bangladesh Time

            </div>

        </div>

    </section>



    <section class="login-area">

        <div class="login-card">

            <div class="welcome">

                <h1>
                    WELCOME BACK
                </h1>

                <p>
                    Please sign in to your account
                </p>

            </div>


            <div class="profile">

                <div class="avatar"></div>

            </div>


            <div class="login-title">
                LOGIN
            </div>


            <div class="login-line"></div>



            <form
                class="form"
                action="/login"
                method="POST">


                <div class="input-wrap">

                    <span class="input-icon">
                        👤
                    </span>


                    <input
                        class="input"
                        type="text"
                        name="username"
                        placeholder="Username or Email"
                        autocomplete="username"
                        required>

                </div>



                <div class="input-wrap">

                    <span class="input-icon">
                        🔒
                    </span>


                    <input
                        class="input"
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>


                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show or hide password"
                        onclick="togglePassword()">
                    </button>

                </div>



                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember">

                        <span>
                            Remember Me
                        </span>

                    </label>


                    <button
                        type="button"
                        class="forgot"
                        onclick="forgotPassword()">

                        Forgot Password?

                    </button>

                </div>



                <button
                    type="submit"
                    class="sign-in">

                    SIGN IN

                </button>



                <div class="divider">

                    <span>
                        OR
                    </span>

                </div>



                <a
                    href="/register"
                    class="register">

                    <span class="register-icon">
                        👥
                    </span>

                    CREATE NEW ACCOUNT

                </a>

            </form>

        </div>

    </section>

</div>



<script>

/* =====================================================
   BANGLADESH LIVE CLOCK
===================================================== */

function updateClock(){

    const now = new Date();

    const parts =
        new Intl.DateTimeFormat(
            "en-GB",
            {
                timeZone:"Asia/Dhaka",
                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                hour12:false
            }
        ).formatToParts(now);


    function get(type){

        const item =
            parts.find(
                p => p.type === type
            );

        return item
            ? item.value
            : "";
    }


    const hour =
        Number(get("hour"));

    const minute =
        Number(get("minute"));

    const second =
        Number(get("second"));


    const hourAngle =
        ((hour % 12) * 30)
        +
        (minute * 0.5);


    const minuteAngle =
        (minute * 6)
        +
        (second * 0.1);


    const secondAngle =
        second * 6;


    document
        .getElementById("hourHand")
        .style.transform =

        `translate(-50%, -100%)
         rotate(${hourAngle}deg)`;


    document
        .getElementById("minuteHand")
        .style.transform =

        `translate(-50%, -100%)
         rotate(${minuteAngle}deg)`;


    document
        .getElementById("secondHand")
        .style.transform =

        `translate(-50%, -100%)
         rotate(${secondAngle}deg)`;


    document
        .getElementById("digitalTime")
        .textContent =

        `${get("hour")}:
         ${get("minute")}:
         ${get("second")}`
         .replace(/\s/g,"");


    document
        .getElementById("date")
        .textContent =

        `${get("weekday")},
         ${get("day")}
         ${get("month")}
         ${get("year")}`;

function togglePassword(){

    const password =
        document.getElementById("password");


    const button =
        document.getElementById("passwordToggle");


    if(
        password.type === "password"
    ){

        password.type = "text";

        button.classList.add("show");

    }

    else{

        password.type = "password";

        button.classList.remove("show");

    }

/* =====================================================
   LOGIN SYSTEM
   ORIGINAL LOGIC + COMPATIBILITY LOGIC
===================================================== */

/*
   এই অংশে Registration page-এর saved data
   বিভিন্ন সম্ভাব্য localStorage key থেকে খোঁজা হবে।

   মূল key:
   portal_registered_user

   এছাড়াও compatibility হিসেবে
   common key-গুলো পরীক্ষা করা হবে।
*/

function getRegisteredUserData(){

    const possibleKeys = [

        "portal_registered_user",

        "registered_user",

        "registeredUser",

        "user",

        "currentUser",

        "account",

        "accountData",

        "registrationData"

    ];


    for(

        let i = 0;

        i < possibleKeys.length;

        i++

    ){

        const savedData =
            localStorage.getItem(
                possibleKeys[i]
            );


        if(
            savedData
        ){

            try{

                const parsedData =
                    JSON.parse(
                        savedData
                    );


                /*
                   যদি Array থাকে,
                   তাহলে প্রথমে matching account
                   login system পরে খুঁজে নেবে।
                */

                if(
                    parsedData
                ){

                    return parsedData;

                }

            }

            catch(error){

                /*
                   JSON না হলেও
                   এই key skip করা হবে
                */

            }

        }

    }


    return null;

}



/* =====================================================
   GET FIELD VALUE
===================================================== */

/*
   Registration page-এর field name ভিন্ন হলে
   এই function বিভিন্ন সম্ভাব্য নাম পরীক্ষা করবে।
*/

function getUserField(
    user,
    fieldNames
){

    for(

        let i = 0;

        i < fieldNames.length;

        i++

    ){

        const value =
            user[
                fieldNames[i]
            ];


        if(
            value !== undefined
            &&
            value !== null
            &&
            String(value).trim() !== ""
        ){

            return String(
                value
            );

        }

    }


    return "";

}



/* =====================================================
   CHECK ONE ACCOUNT
===================================================== */

function checkAccountLogin(
    user,
    enteredUsername,
    enteredPassword
){

    if(
        !user
        ||
        typeof user !== "object"
    ){

        return false;

    }


    const savedUsername =
        getUserField(
            user,
            [

                "userName",

                "username",

                "user_name",

                "name",

                "fullName"

            ]
        )
        .trim()
        .toLowerCase();


    const savedEmail =
        getUserField(
            user,
            [

                "email",

                "emailAddress",

                "email_address",

                "userEmail"

            ]
        )
        .trim()
        .toLowerCase();


    const savedPassword =
        getUserField(
            user,
            [

                "password",

                "userPassword",

                "pass",

                "user_password"

            ]
        );


    const usernameMatched =

        enteredUsername ===
        savedUsername

        ||

        enteredUsername ===
        savedEmail;


    const passwordMatched =

        enteredPassword ===
        savedPassword;


    return (
        usernameMatched
        &&
        passwordMatched
    );

}



/* =====================================================
   FORM SUBMIT
===================================================== */

document
    .querySelector(".form")
    .addEventListener(
        "submit",
        function(e){

            /*
               Prevent normal form submission
            */

            e.preventDefault();


            /* =================================================
               GET INPUTS
            ================================================= */

            const usernameInput =
                document.querySelector(
                    'input[name="username"]'
                );


            const passwordInput =
                document.getElementById(
                    "password"
                );


            const username =
                usernameInput.value
                    .trim()
                    .toLowerCase();


            const enteredPassword =
                passwordInput.value;



            /* =================================================
               GET REGISTERED ACCOUNT
            ================================================= */

            const savedUserData =
                getRegisteredUserData();



            /* No account found */

            if(
                !savedUserData
            ){

                alert(
                    "No registered account found. Please create a new account first."
                );

                return;

            }



            let matchedUser =
                null;



            /* =================================================
               IF MULTIPLE ACCOUNTS ARRAY
            ================================================= */

            if(
                Array.isArray(
                    savedUserData
                )
            ){

                for(

                    let i = 0;

                    i < savedUserData.length;

                    i++

                ){

                    if(

                        checkAccountLogin(

                            savedUserData[i],

                            username,

                            enteredPassword

                        )

                    ){

                        matchedUser =
                            savedUserData[i];

                        break;

                    }

                }

            }



            /* =================================================
               SINGLE ACCOUNT
            ================================================= */

            else{

                if(

                    checkAccountLogin(

                        savedUserData,

                        username,

                        enteredPassword

                    )

                ){

                    matchedUser =
                        savedUserData;

                }

            }



            /* =================================================
               LOGIN SUCCESS
            ================================================= */

            if(
                matchedUser
            ){

                /*
                   Give permission to enter index.html
                */

                localStorage.setItem(
                    "portal_home_access_granted",
                    "true"
                );


                /*
                   Get username safely
                */

                const currentUsername =
                    getUserField(
                        matchedUser,
                        [

                            "userName",

                            "username",

                            "user_name",

                            "name",

                            "fullName",

                            "email"

                        ]
                    );


                /*
                   Save current username
                */

                localStorage.setItem(
                    "portal_current_user",
                    currentUsername
                );


                /*
                   Optional login state
                */

                localStorage.setItem(
                    "portal_user_logged_in",
                    "true"
                );


                /*
                   Remember Me logic
                */

                const rememberCheckbox =
                    document.querySelector(
                        'input[name="remember"]'
                    );


                if(
                    rememberCheckbox
                    &&
                    rememberCheckbox.checked
                ){

                    localStorage.setItem(
                        "portal_remembered_user",
                        usernameInput.value
                    );

                }

                else{

                    localStorage.removeItem(
                        "portal_remembered_user"
                    );

                }


                /*
                   Login successful
                */

                alert(
                    "Login successful!"
                );


                /*
                   Automatically open home page
                */

                window.location.href =
                    "index.html";


                return;

            }



            /* =================================================
               LOGIN FAILED
            ================================================= */

            else{

                /*
                   Remove old successful login permission
                */

                localStorage.removeItem(
                    "portal_home_access_granted"
                );


                localStorage.removeItem(
                    "portal_user_logged_in"
                );


                alert(
                    "Incorrect username/email or password."
                );


                /*
                   Put cursor back into password field
                */

                passwordInput.focus();

            }

        }
    );



/* =====================================================
   AUTO FILL REMEMBERED USER
   NEW LOGIC
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        const rememberedUser =
            localStorage.getItem(
                "portal_remembered_user"
            );


        const usernameInput =
            document.querySelector(
                'input[name="username"]'
            );


        if(
            rememberedUser
            &&
            usernameInput
        ){

            usernameInput.value =
                rememberedUser;


            const rememberCheckbox =
                document.querySelector(
                    'input[name="remember"]'
                );


            if(
                rememberCheckbox
            ){

                rememberCheckbox.checked =
                    true;

            }

        }

    }
);
