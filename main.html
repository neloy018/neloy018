<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Website</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
    }

    header {
        width: 100%;
        padding: 20px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.25);
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        font-size: 15px;
    }

    nav a:hover {
        color: #38bdf8;
    }

    .hero {
        min-height: calc(100vh - 75px);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 30px;
    }

    .hero-content {
        max-width: 700px;
    }

    .hero h1 {
        font-size: clamp(40px, 8vw, 70px);
        margin-bottom: 20px;
    }

    .hero h1 span {
        color: #38bdf8;
    }

    .hero p {
        font-size: 18px;
        line-height: 1.7;
        color: #cbd5e1;
        margin-bottom: 30px;
    }

    .btn {
        display: inline-block;
        padding: 14px 30px;
        background: #38bdf8;
        color: #0f172a;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn:hover {
        transform: translateY(-3px);
        background: #7dd3fc;
    }

    footer {
        text-align: center;
        padding: 20px;
        color: #94a3b8;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        header {
            padding: 18px 5%;
        }

        nav a {
            margin-left: 10px;
            font-size: 13px;
        }

        .hero p {
            font-size: 16px;
        }
    }
</style>

</head><body><header>
    <div class="logo">My Website</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main class="hero">
    <div class="hero-content">
        <h1>Welcome to <span>My Website</span></h1>

        <p>
            This is my personal website.
            You can customize this page and add your own
            features, login system, registration system,
            or other content here.
        </p>

        <a href="#" class="btn">Get Started</a>
    </div>
</main>

<footer>
    © 2026 My Website. All Rights Reserved.
</footer>

</body>
</html>
