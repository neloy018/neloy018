<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  
  <!-- CSS Connection Link -->
  <link rel="stylesheet" href="registration.css">
</head>

<body>

  <!-- BANGLADESH STANDARD TIME CLOCK -->
  <div class="bd-clock-box" title="Bangladesh Standard Time" aria-label="Bangladesh Standard Time">
    <div class="bd-clock">
      <div class="bd-clock-face">
        <span class="clock-number number-12">12</span>
        <span class="clock-mark" style="--angle:30deg"></span>
        <span class="clock-mark" style="--angle:60deg"></span>
        <span class="clock-number number-3">3</span>
        <span class="clock-mark" style="--angle:120deg"></span>
        <span class="clock-mark" style="--angle:150deg"></span>
        <span class="clock-number number-6">6</span>
        <span class="clock-mark" style="--angle:210deg"></span>
        <span class="clock-mark" style="--angle:240deg"></span>
        <span class="clock-number number-9">9</span>
        <span class="clock-mark" style="--angle:300deg"></span>
        <span class="clock-mark" style="--angle:330deg"></span>

        <div class="clock-hand hour-hand" id="hourHand"></div>
        <div class="clock-hand minute-hand" id="minuteHand"></div>
        <div class="clock-hand second-hand" id="secondHand"></div>
        <div class="clock-center"></div>
      </div>
    </div>
  </div>

  <!-- MAIN REGISTRATION -->
  <div class="container">
    <div class="title">REGISTRATION</div>

    <div class="card">
      <button class="close" type="button" onclick="document.querySelector('.card').style.display='none'">×</button>

      <div class="profile">
        <div class="person-head"></div>
        <div class="person-body"></div>
      </div>

      <form id="registerForm" class="form">
        <!-- FIRST NAME -->
        <div class="field-wrap">
          <span class="field-icon">👤</span>
          <input class="field" id="firstName" type="text" placeholder="First Name" autocomplete="given-name">
        </div>

        <!-- LAST NAME -->
        <div class="field-wrap">
          <span class="field-icon">👤</span>
          <input class="field" id="lastName" type="text" placeholder="Last Name" autocomplete="family-name">
        </div>

        <!-- USER NAME -->
        <div class="field-wrap">
          <span class="field-icon">👤</span>
          <input class="field" id="userName" type="text" placeholder="User Name" autocomplete="username">
        </div>

        <!-- EMAIL -->
        <div class="field-wrap">
          <span class="field-icon">✉</span>
          <input class="field" id="email" type="email" placeholder="Email Address" autocomplete="email">
        </div>

        <!-- PASSWORD -->
        <div class="field-wrap">
          <span class="field-icon">🔒</span>
          <input class="field" id="password" type="password" placeholder="Password" autocomplete="new-password">
          <button class="toggle" type="button" data-target="password">SHOW</button>
        </div>

        <!-- PASSWORD REQUIREMENTS -->
        <div class="requirements">
          <div class="req-title">
            Password must contain: capital, small letter, number, special character &amp; minimum 8 characters.
          </div>

          <div class="req-list">
            <span class="req" id="rUpper">Capital</span>
            <span class="req" id="rLower">Small</span>
            <span class="req" id="rNumber">Number</span>
            <span class="req" id="rSpecial">Special</span>
            <span class="req" id="rLength">8+ Characters</span>
          </div>

          <div class="strength">
            <div id="strengthFill" class="strength-fill"></div>
          </div>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="field-wrap">
          <span class="field-icon">🔒</span>
          <input class="field" id="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password">
          <button class="toggle" type="button" data-target="confirmPassword">SHOW</button>
        </div>

        <!-- NEWSLETTER -->
        <div class="newsletter">
          <input id="newsletter" type="checkbox" checked>
          <label for="newsletter">Subscribe to Newsletter</label>
        </div>

        <!-- BUTTONS -->
        <div class="buttons">
          <button class="main signup" type="submit">SIGN UP</button>
          <div class="or"><span>OR</span></div>
          <button class="main signin" type="button" id="signInBtn">SIGN IN</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Connection Link -->
  <script src="registration.js"></script>
</body>

</html>
